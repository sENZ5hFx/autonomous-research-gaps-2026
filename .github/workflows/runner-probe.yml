name: Runner Capacity Probe

on:
  push:
    branches: ['ci/runner-capacity-probe']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prove runner execution
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "sha=${GITHUB_SHA}"
          test -n "${RUNNER_NAME}"
