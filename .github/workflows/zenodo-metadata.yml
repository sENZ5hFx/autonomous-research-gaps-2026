name: Verify Zenodo metadata

on:
  pull_request:
    branches: [main]
    paths:
      - 'CITATION.cff'
      - '.zenodo.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'CITATION.cff'
      - '.zenodo.json'
      - '.github/workflows/zenodo-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenodo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install verifier
        run: python -m pip install --disable-pip-version-check cffconvert

      - name: Validate citation metadata
        run: |
          set -euo pipefail
          test -s CITATION.cff
          cffconvert --validate -i CITATION.cff

      - name: Verify generated Zenodo metadata is reproducible
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          cffconvert -f zenodo -i CITATION.cff -o "$tmp"
          python - "$tmp" .zenodo.json <<'PY'
          import json, sys
          generated, tracked = sys.argv[1:]
          with open(generated, encoding='utf-8') as f:
              a = json.load(f)
          with open(tracked, encoding='utf-8') as f:
              b = json.load(f)
          if a != b:
              raise SystemExit('.zenodo.json is stale relative to CITATION.cff')
          print('Zenodo metadata is reproducible and current')
          PY
